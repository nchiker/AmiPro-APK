[package]
name = "amipro-mobile"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# The Ami Pro for Linux core: no third-party dependencies of its own.
amipro-document = { path = "../../external/AmiPro-Linux/crates/document" }
amipro-formats = { path = "../../external/AmiPro-Linux/crates/ami-formats" }
amipro-editing = { path = "../../external/AmiPro-Linux/crates/editing" }
amipro-pictures = { path = "../../external/AmiPro-Linux/crates/pictures" }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff"] }
uniffi = { version = "0.29.4", features = ["cli"] }
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
